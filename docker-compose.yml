services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: knowrag
      POSTGRES_USER: knowrag
      POSTGRES_PASSWORD: knowrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
